  line1: GILDONG        # 히어로 첫 줄 (이름)
  line2: HONG           # 둘째 줄 (성, 톤을 낮춰 보여 줌)
  line3: "ROBOTICS × AI" # 셋째 줄 (분야, ×는 포인트색)

