name: 자소서 쓰기
description: 지원 문항에 맞는 경험을 고르고 자기소개서 초안을 작성합니다.
title: "[자소서] "
labels: [essay]
body:
  - type: input
    id: target
    attributes:
      label: 지원처
      description: 지원하는 회사나 기관 이름과 직무를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: 자소서 문항
      description: 답변하려는 문항 하나를 원문 그대로 붙여 넣어 주세요.
    validations:
      required: true
  - type: input
    id: limit
    attributes:
      label: 글자 수 제한
      description: 제한이 있으면 공백을 포함한 최대 글자 수를 적어 주세요.
      placeholder: "800"
