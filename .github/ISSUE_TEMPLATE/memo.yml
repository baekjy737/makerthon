name: 기존 항목에 메모 추가하기
description: 이미 기록한 활동에 새로 떠오른 경험이나 세부 내용을 덧붙입니다.
title: "[메모] "
labels: [memo]
body:
  - type: input
    id: entry
    attributes:
      label: 항목 경로
      description: 메모를 추가할 기존 항목의 Markdown 파일 경로를 적어 주세요.
      placeholder: content/entries/2026-10-makerthon.md
    validations:
      required: true
  - type: textarea
    id: memo
    attributes:
      label: 메모
      description: 이 활동에 추가할 내용을 적어 주세요.
    validations:
      required: true
