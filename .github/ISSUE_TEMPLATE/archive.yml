name: 활동 기록하기
description: 활동 메모와 관련 자료를 아카이브에 기록합니다.
title: "[기록] "
labels: [archive]
body:
  - type: textarea
    id: memo
    attributes:
      label: 활동 메모
      description: 활동 시기, 맡은 역할, 한 일을 기억나는 만큼 적어 주세요. 이미지나 PDF는 이 칸에 끌어다 놓으면 첨부됩니다.
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: 관련 링크
      description: GitHub 저장소, 발표 자료 등 활동을 확인할 수 있는 주소를 한 줄에 하나씩 적어 주세요.
