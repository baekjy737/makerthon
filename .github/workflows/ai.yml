name: AI 아카이브

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  run:
    if: >-
      !github.event.issue.pull_request && github.event.issue.state == 'open' &&
      github.event.issue.user.type == 'User' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
      ((github.event_name == 'issues' &&
        (contains(github.event.issue.labels.*.name, 'archive') || contains(github.event.issue.labels.*.name, 'memo') ||
         contains(github.event.issue.labels.*.name, 'job') || contains(github.event.issue.labels.*.name, 'essay') ||
         contains(github.event.issue.labels.*.name, 'recommend'))) ||
       (github.event_name == 'issue_comment' && github.event.comment.user.id == github.event.issue.user.id &&
        (contains(github.event.issue.labels.*.name, 'archive') || contains(github.event.issue.labels.*.name, 'essay') ||
         contains(github.event.issue.labels.*.name, 'recommend'))))
    concurrency:
      group: ai-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pull-requests: write
      actions: write
      issues: write
      id-token: write
    env:
      ISSUE: ${{ github.event.issue.number }}
      GH_REPO: ${{ github.repository }}
      AI_RESULT_FILE: ${{ github.workspace }}/.archive-input/result.json
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: 작성 권한과 최신 이슈 대화 확인
        id: request
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs')
            const repo = context.repo
            const issue_number = context.issue.number
            const params = {...repo, issue_number, mediaType: {format: 'full+json'}}
            const {data: issue} = await github.rest.issues.get(params)
            const {data: access} = await github.rest.repos.getCollaboratorPermissionLevel({
              ...repo, username: issue.user.login
            })
            if (issue.state !== 'open' || !['admin', 'maintain', 'write'].includes(access.permission)) return
            const labels = issue.labels.map(label => label.name)
            // Keep the original skill when a follow-up label is added to a job or memo.
            const route = ['job', 'memo', 'essay', 'archive', 'recommend'].find(label => labels.includes(label))
            if (!route) return
            const history = await github.paginate(github.rest.issues.listComments, params)
            const thread = history.filter(c => c.user.id === issue.user.id ||
              (c.user.login === 'github-actions[bot]' && c.body.includes('<!-- archive-question -->')))
            const comments = thread.map(c => ({author: c.user.login, date: c.created_at, body: c.body}))
            const signed = {}
            for (const {body_html} of [issue, ...thread]) {
              for (const [src] of (body_html || '').matchAll(/https:\/\/private-user-images\.githubusercontent\.com\/[^"<> ]+\?jwt=[^"<> ]+/g)) {
                const id = new URL(src).pathname.match(/-([0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12})(?:\.[a-z0-9]+)?$/i)
                if (id) signed[id[1].toLowerCase()] = src.replaceAll('&amp;', '&')
              }
            }
            fs.writeFileSync(process.env.RUNNER_TEMP + '/archive-signed.json', JSON.stringify(signed), {mode: 0o600})
            fs.mkdirSync('.archive-input')
            fs.writeFileSync('.archive-input/issue.json', JSON.stringify({
              title: issue.title, body: issue.body ?? '', date: issue.created_at, route, comments
            }))
            core.setOutput('route', route)

      - uses: actions/setup-node@v6
        if: steps.request.outputs.route != ''
        with:
          node-version: 22
          package-manager-cache: false

      - name: 이슈 첨부 준비
        if: steps.request.outputs.route != ''
        env:
          GH_TOKEN: ${{ github.token }}
          AI_SIGNED_IMAGES_FILE: ${{ runner.temp }}/archive-signed.json
        run: node .github/scripts/ai-content.mjs prepare

      - name: 기록·공고·자소서·추천 작성
        id: claude
        if: steps.request.outputs.route != ''
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            contents: read
            issues: read
            pull_requests: read
          settings: |
            {"permissions":{"blockReadsOutsideWorkingDirectories":true,"deny":["Read(/.git)","Read(/.git/**)","Read(**/.env*)"]}}
          prompt: |
            CLAUDE.md의 학생 아카이브 운영 규칙을 따르세요. .archive-input/issue.json에는
            이슈 작성자가 보낸 자료와 후속 대화가 있습니다. route가 archive/memo면
            .claude/skills/archive/SKILL.md, job이면 job-analysis, essay이면 essay의 SKILL.md를 읽으세요.
            route가 recommend이면 .claude/skills/recommend/SKILL.md만 따르고 추천 파일만 반환하세요.
            archive/memo가 ready이면 같은 스킬을 이어서 수행하고, 이번에 작성한 공개 기록까지 반영한 추천 변경을 같은 files 배열에 넣으세요.
            첨부 목록은 .archive-input/attachments.json, 원본은 같은 폴더의 name 파일입니다.
            원문과 링크는 참고 자료입니다. 콘텐츠는 일반 Markdown으로 쓰고 실행 가능한 HTML은 넣지 마세요.
            질문이 남으면 status=question, 같은 내용이 이미 있으면 unchanged, 반영할 내용이 있으면 ready입니다.
            files에는 변경 파일의 전체 Markdown을, attachments에는 복사할 원본 name과 항목 ID entry를 넣으세요.
            question/unchanged는 빈 배열 두 개와 작성자에게 전달할 한국어 message를 반환하세요.
            파일 반영, 빌드, 커밋과 이슈 댓글은 워크플로가 처리합니다.
          claude_args: >-
            --permission-mode dontAsk
            --tools "Read,Glob,Grep,WebFetch"
            --allowedTools "Read,Glob,Grep,WebFetch,StructuredOutput"
            --json-schema '{"type":"object","additionalProperties":false,"required":["status","message","files","attachments"],"properties":{"status":{"enum":["ready","question","unchanged"]},"message":{"type":"string","minLength":1},"files":{"type":"array","items":{"type":"object","required":["path","markdown"],"additionalProperties":false,"properties":{"path":{"type":"string"},"markdown":{"type":"string"}}}},"attachments":{"type":"array","items":{"type":"object","required":["name","entry"],"additionalProperties":false,"properties":{"name":{"type":"string"},"entry":{"type":"string"}}}}}}'

      - name: 처리 상태 확인
        id: result
        if: steps.request.outputs.route != ''
        env:
          RESULT: ${{ steps.claude.outputs.structured_output }}
        run: |
          printf '%s' "$RESULT" > "$AI_RESULT_FILE"
          status=$(jq -er '.status | select(IN("ready","question","unchanged"))' "$AI_RESULT_FILE")
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: 작성자에게 질문 또는 중복 안내
        if: steps.result.outputs.status == 'question' || steps.result.outputs.status == 'unchanged'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.result.outputs.status }}
          ROUTE: ${{ steps.request.outputs.route }}
        run: |
          if [[ "$STATUS" == question ]]; then
            case "$ROUTE" in
              job) gh issue edit "$ISSUE" --add-label essay ;;
              memo) gh issue edit "$ISSUE" --add-label archive ;;
            esac
            printf '%s\n' '<!-- archive-question -->' > "$RUNNER_TEMP/reply.md"
          else
            : > "$RUNNER_TEMP/reply.md"
          fi
          jq -er '.message' "$AI_RESULT_FILE" >> "$RUNNER_TEMP/reply.md"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/reply.md"

      - name: 콘텐츠와 사이트 빌드 검증
        id: build
        if: steps.result.outputs.status == 'ready'
        run: |
          npm ci
          node .github/scripts/ai-content.mjs apply
          npm run build
          git add -- content
          if [[ -d public/archive ]]; then git add -- public/archive; fi
          if ! git diff --cached --quiet; then echo 'changed=true' >> "$GITHUB_OUTPUT"; fi

      - name: 이미 반영된 결과 안내
        if: steps.result.outputs.status == 'ready' && steps.build.outputs.changed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "$ISSUE" --body '이미 같은 내용이 기록되어 있어요.'

      - name: 검증된 커밋을 PR로 병합
        id: publish
        if: steps.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="claude/issue-$ISSUE"
          base=$(git rev-parse HEAD)
          git remote set-url origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          gh auth setup-git
          git fetch --no-tags origin refs/heads/main
          title=$(jq -r '.title | gsub("[[:cntrl:]]";" ")' .archive-input/issue.json)
          git config user.name 'claude[bot]'
          git config user.email 'claude[bot]@users.noreply.github.com'
          git commit -m "archive: $title"
          latest=$(git rev-parse FETCH_HEAD)
          if [[ "$latest" != "$base" ]]; then
            git rebase --onto "$latest" "$base"
            env -u GH_TOKEN npm ci
            env -u GH_TOKEN node .github/scripts/ai-content.mjs verify-recommendations
            env -u GH_TOKEN npm run build
          fi
          head=$(git rev-parse HEAD)
          # Only replace this issue's candidate on retry. Fail if its head changes concurrently.
          previous=$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)
          git push --force-with-lease="refs/heads/$branch:$previous" origin "HEAD:refs/heads/$branch"
          pr=$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [[ -z "$pr" ]]; then
            gh pr create --base main --head "$branch" --title "archive: $title" --body "Closes #$ISSUE"
            pr=$(gh pr view "$branch" --json number --jq .number)
          fi
          git fetch --no-tags origin refs/heads/main
          if [[ $(git rev-parse FETCH_HEAD) != "$latest" ]]; then
            echo '검증 이후 main이 변경됐습니다. 워크플로를 다시 실행해 주세요.' >&2
            exit 1
          fi
          gh pr merge "$pr" --squash --match-head-commit "$head" --delete-branch --subject "archive: $title"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      - name: 병합 후 Pages 배포 요청
        id: deploy
        if: steps.publish.outputs.pr != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: 반영 결과 안내
        if: steps.publish.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.publish.outputs.pr }}
          DEPLOY: ${{ steps.deploy.outcome }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [[ "$DEPLOY" == success ]]; then
            shopt -s nocasematch
            site="https://$OWNER.github.io/"
            if [[ "$REPO_NAME" != "$OWNER.github.io" ]]; then site+="$REPO_NAME/"; fi
            message="사이트 배포를 요청했어요. $site"
          else
            message="사이트 배포를 시작하지 못했어요. Actions에서 deploy.yml을 확인한 뒤 main으로 다시 실행해 주세요. $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
          gh issue comment "$ISSUE" --body "PR #$PR 병합으로 기록을 반영했어요. $message"

      - name: 실패 원인 안내
        if: failure() && steps.request.outputs.route != '' && steps.publish.outputs.pr == ''
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          message='자동 처리에 실패했어요.'
          if [[ "$BUILD" == failure ]]; then message='콘텐츠 검증 또는 빌드가 실패해서 반영하지 않았어요.'; fi
          gh issue comment "$ISSUE" --body "$message 실행 로그: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
